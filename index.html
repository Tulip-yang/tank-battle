<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="640" height="640"></canvas>
    <div id="hud">
      <div>分数: <span id="score">0</span></div>
      <div>生命: <span id="lives">3</span></div>
      <div>敌人: <span id="enemies">0</span></div>
    </div>
    <div id="hint">WASD/方向键 移动 · 空格 射击 · P/Esc 暂停</div>
  </div>
  <div id="controls">
    <div id="dpad">
      <button id="btn-up" data-key="ArrowUp">▲</button>
      <button id="btn-left" data-key="ArrowLeft">◀</button>
      <button id="btn-right" data-key="ArrowRight">▶</button>
      <button id="btn-down" data-key="ArrowDown">▼</button>
    </div>
    <button id="btn-fire">开火</button>
    <button id="btn-pause">暂停</button>
  </div>
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/tank.js"></script>
  <script src="js/bullet.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/game.js"></script>
  <script src="js/touch.js"></script>
</body>
</html>
